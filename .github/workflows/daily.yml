name: 每日新闻日报

on:
  schedule:
    # 每天北京时间 06:00 更新 = UTC 22:00 (前一日)
    - cron: "0 22 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install feedparser pyyaml requests

      - name: 运行抓取脚本
        run: python fetch_news.py

      - name: 提交更新后的日报
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --cached --quiet || git commit -m "每日新闻日报自动更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
